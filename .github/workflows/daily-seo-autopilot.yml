name: Daily 24/7 Cloud SEO Autopilot & Sitemap/RSS Refresh

on:
  schedule:
    # 매일 한국시간 오전 08:30 (23:30 UTC) 자동 실행 (내 컴퓨터가 꺼져 있어도 클라우드에서 자동 실행!)
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild SSG, Sitemap.xml, RSS.xml, LLMs.txt & Viral Bundles
        run: node scripts/night-growth.js --live

      - name: Broadcast to Google WebSub, Naver/Bing IndexNow & RSS Aggregators
        run: node scripts/seo-autopilot.js --live

      - name: Send Telegram Completion Report (if configured)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/telegram-notify.js

      - name: Commit & Push Updated Sitemap/RSS/Reports to Trigger Live Redeploy
        run: |
          git config user.name "MoneyFit SEO Autopilot Bot"
          git config user.email "jjangdol0205@github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(seo-autopilot): automated daily sitemap, RSS & IndexNow broadcast" && git push origin main)
